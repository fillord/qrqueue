name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: queue
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: queue
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U queue -d queue"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+asyncpg://queue:test-only-password@localhost:5432/queue
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-only-jwt-secret-not-for-deployment
      QR_TOKEN_SECRET: test-only-qr-secret-not-for-deployment
      SUPERADMIN_EMAIL: ci@example.com
      SUPERADMIN_PASSWORD: test-only-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python backend/scripts/test.py -q
