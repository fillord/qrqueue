name: Public site availability
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the public application and its database connection
        run: |
          curl --fail --silent --show-error --location --retry 2 --retry-delay 10 --max-time 20 \
            --output /dev/null https://queue.omni-book.site/api/health
          curl --fail --silent --show-error --location --retry 2 --retry-delay 10 --max-time 20 \
            --output /dev/null https://queue.omni-book.site/login
