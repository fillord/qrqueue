services:
  frontend:
    ports:
      - "8080:80"

  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --reload --proxy-headers --forwarded-allow-ips=*

  db:
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    volumes:
      - redis-data:/data

  db-backup:
    profiles: ["prod"]

volumes:
  db-data:
  redis-data:
