server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Хешированные бандлы (main-<hash>.js/css) — имя меняется при каждой
    # пересборке, поэтому их можно кэшировать намертво и надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: все маршруты (/q/..., /tv/..., /admin/...) отдаём index.html.
    # index.html и sw.js не хешируются, поэтому им нужна обязательная
    # ревалидация — иначе браузер годами ссылается на старые /assets/*.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # REST API
    location /api/ {
        client_max_body_size 5m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Реальный IP посетителя за Cloudflare — для гео и rate limiting
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # WebSocket: ТВ-экраны, панели операторов, страницы посетителей
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
